services:
  - type: web
    name: smart-traffic-dashboard
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MQTT_URL
        value: mqtts://io.adafruit.com:8883
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: AIO_GROUP_KEY
        value: smart-traffic
      - key: DEVICE_ID
        value: ESP32-Traffic
