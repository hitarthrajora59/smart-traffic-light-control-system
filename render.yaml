services:
  - type: web
    name: smart-traffic-dashboard
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-traffic-db
          property: connectionString
      - key: MQTT_URL
        sync: false
      - key: MQTT_TOPIC
        value: smart-traffic/+/telemetry
      - key: MQTT_CONTROL_TOPIC
        value: smart-traffic/control

databases:
  - name: smart-traffic-db
